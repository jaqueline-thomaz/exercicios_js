    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        let musicas = ["Luther", "Please don't go", "Sign of the times", "Great expectation"];

        document.write("<h2>Minha playlist</h2>");

        for (let i = 0; i <= musicas.length; i++){
            document.write((i + 1) + "." + musicas[i] + "<br>");
        }

            document.write("<p>Total: " + musicas.length + " musicas</p>")

            //porque ele usa o valor da variavel musicas, com <= aparece um 5 elemento na lista
    </script>
</body>

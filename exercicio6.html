<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 6</title>
</head>
<body>
    <script>
        let tarefas = [];
        let quant = Number(prompt("Quantas tarefas?"))
        for (let i = 1; i <= quant; i++){
            let tarefa = prompt("Digite a tarefa " + i );
            tarefas.push(tarefa);
        }
        
        document.write("<h2>Tarefas da semana</h2>");

        for(let i = 0; i < tarefas.length; i++){
            document.write("• " + tarefas[i] + "<br>");
        }

        document.write("<br>" + quant + " tarefas foram adicionadas.")


        //para a pessoa ir adicionando a lista de tarefas,
        //  o for começa com 1 para ordenar as quantidades da tarefas que voce irá escrever,
        //e o que começa com 0 é pra indicar a primeira posição da lista
    </script>
</body>
</html>

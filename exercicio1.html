<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
</head>
<body>
    <script>
        let nome = prompt("Qual o seu nome?");
        let cidade = prompt("Em qual cidade você mora?")
        let hobby = prompt("O que gosta de fazer no tempo livre?");

        alert("Prazer, " + nome + " de " + cidade + "!\n" + "Que legal! Você curte " + hobby + ".");
     
        //prompt é onde realizamos a pergunta, e, alert onde sai o resultado da pergunta. nome fica sem aspas porque é uma variável
    </script>
</body>
</html>

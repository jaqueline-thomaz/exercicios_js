<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 3</title>
</head>
<body>
    <script>
        document.write("<h2>Contagem</h2>");

        for (let i = 1; i <= 20; i++){
            document.write("Volta numero " + i + "<br>")
        }
        
        document.write("<h2>Contagem 10 em 10</h2>");
        for (let i = 10; i <= 100; i += 10){
            document.write(i + "<br>")
        }
        
        document.write("fim!");
        // não aumentaria a soma
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 4</title>
</head>
<body>
    <script>
        let series = ["Breaking Bad", "Diário de um vampiro", "Gossip Girl"];

        alert("Minha série favorita é " + series[0]);
        alert("Tenho " + series.length + " séries na lista");

        series.push("Prison Break");
        alert("Agora são " + series.length + " séries");
        alert("A ultima é " + series[3]);

        //porque em js começa a contagem em 0, o push sobe mais um item a lista
    </script>
</body>
</html>
